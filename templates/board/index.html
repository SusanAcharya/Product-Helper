<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskTrack</title>
    <link rel="stylesheet" href="./board.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to TaskTrack</a>
    <p class="notice">
      <strong>TaskTrack</strong>
      — this is the plan. Bookmark this page.
      You read. Your coding agent writes the cards.
      Open again with <code>npx product-helper open</code>.
    </p>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">TaskTrack</p>
          <h1 id="product-name">Product</h1>
        </div>
      </div>
      <p class="tagline" id="product-tagline"></p>
      <div class="top-actions">
        <label class="search">
          <span class="visually-hidden">Find a feature</span>
          <input id="search" type="search" placeholder="Find a feature" />
        </label>
        <button type="button" id="theme-toggle" class="ghost" aria-pressed="false">Dark</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Views">
      <button type="button" class="tab is-active" data-view="board">Plan</button>
      <button type="button" class="tab" data-view="roadmap">Now</button>
      <button type="button" class="tab" data-view="timeline">Timeline</button>
      <button type="button" class="tab" data-view="product">Product</button>
      <button type="button" class="tab" data-view="guardrails">Rules</button>
    </nav>

    <main id="main">
      <section id="view-board" class="view is-active" aria-label="TaskTrack"></section>
      <section id="view-roadmap" class="view" hidden aria-label="Now, next, later"></section>
      <section id="view-timeline" class="view" hidden aria-label="Timeline"></section>
      <section id="view-product" class="view doc" hidden aria-label="Product document"></section>
      <section id="view-guardrails" class="view doc" hidden aria-label="Rules"></section>
    </main>

    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <button type="button" class="icon-close" id="drawer-close" aria-label="Close">Close</button>
        <p class="eyebrow" id="drawer-status"></p>
        <h2 id="drawer-title"></h2>
        <p id="drawer-desc"></p>
        <dl class="meta"></dl>
      </div>
    </aside>

    <footer class="foot">
      <p id="generated-at"></p>
      <p>Features only. Small bug fixes stay off TaskTrack.</p>
    </footer>
    <script src="./data.js"></script>
    <script src="./board.js"></script>
  </body>
</html>
